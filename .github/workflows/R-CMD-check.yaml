# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# with a BiocCheck job added for Bioconductor.
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# main is Bioconductor devel (3.25), which is built with R-devel.
# exposomeSC has no release branch until Bioconductor 3.25 is released:
# RELEASE_3_25 will then use R 4.7 and Bioconductor 3.25, and main the
# next R-devel and Bioconductor 3.26.
#
# R_BIOC_VERSION sets the Bioconductor version that pak installs from.
# Without it pak uses the default built into R, which lags behind: on
# 2026-11-26 R-devel gave 3.24 on Linux and macOS but 3.23 on Windows.
# main goes without it for now, because the day after the 3.24 release
# the 3.25 repository still lacked SingleCellExperiment; set it to '3.25'
# once it is there. Check all of these values when Bioconductor 3.25 is
# released.
on:
  push:
    branches: [main, 'RELEASE_*']
  pull_request:

name: R-CMD-check

permissions: read-all

env:
  R_VERSION: ${{ startsWith(github.base_ref || github.ref_name, 'RELEASE_') && '4.7' || 'devel' }}
  R_BIOC_VERSION: ${{ startsWith(github.base_ref || github.ref_name, 'RELEASE_') && '3.25' || '' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          http-user-agent: ${{ runner.os == 'Linux' && env.R_VERSION == 'devel' && 'release' || '' }}

      # R-devel has no macOS binaries, so every dependency is compiled here
      # (pak 0.11.2 also recompiles the packages that come with R,
      # r-lib/pak#926). data.table, nlme and Matrix include <libintl.h>, and
      # jpeg (needed by marquee) links libjpeg. CRAN's macOS build of R
      # expects both under /opt/R/arm64; install.libs() puts CRAN's own
      # builds there (r-lib/actions#1017).
      - name: Install gettext and libjpeg for source builds (macOS, R-devel)
        if: runner.os == 'macOS' && env.R_VERSION == 'devel'
        run: |
          sudo "$(command -v Rscript)" -e "source('https://mac.R-project.org/bin/install.R'); install.libs(c('gettext', 'jpeg'))"
          test -f "/opt/R/$(uname -m)/include/libintl.h"
          test -f "/opt/R/$(uname -m)/include/jpeglib.h"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The Bioconductor build system checks without --as-cran.
          args: 'c("--no-manual", "--timings")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  BiocCheck:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          http-user-agent: ${{ env.R_VERSION == 'devel' && 'release' || '' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::BiocCheck
          needs: check

      - name: BiocCheckGitClone
        run: |
          res <- BiocCheck::BiocCheckGitClone()
          if (res$getNum("error") > 0) quit(status = 1)
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(
            "new-package" = FALSE,
            "no-check-bioc-help" = TRUE,
            "quit-with-status" = TRUE
          )
        shell: Rscript {0}
