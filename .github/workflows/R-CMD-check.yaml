# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# with a BiocCheck job added for Bioconductor.
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# main is Bioconductor devel (3.25, built with R-devel). The first release
# branch, RELEASE_3_25, arrives with the 3.25 release and will use R 4.7.
# Set R_BIOC_VERSION to 3.25 here once that repository has all our
# dependencies, since the Bioconductor version R picks by default lags
# behind. Until then leave it out rather than empty: R CMD build fails on
# an empty value.
on:
  push:
    branches: [main, 'RELEASE_*']
  pull_request:

name: R-CMD-check

permissions: read-all

env:
  R_VERSION: ${{ startsWith(github.base_ref || github.ref_name, 'RELEASE_') && '4.7' || 'devel' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          http-user-agent: ${{ runner.os == 'Linux' && env.R_VERSION == 'devel' && 'release' || '' }}

      # There are no macOS binaries for R-devel, so dependencies are built
      # from source. data.table, nlme and Matrix need gettext's libintl.h
      # and jpeg needs libjpeg, both where CRAN's R looks for them
      # (r-lib/actions#1017).
      - name: Install gettext and libjpeg for source builds (macOS, R-devel)
        if: runner.os == 'macOS' && env.R_VERSION == 'devel'
        run: |
          sudo "$(command -v Rscript)" -e "source('https://mac.R-project.org/bin/install.R'); install.libs(c('gettext', 'jpeg'))"
          test -f "/opt/R/$(uname -m)/include/libintl.h"
          test -f "/opt/R/$(uname -m)/include/jpeglib.h"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # The Bioconductor build system checks without --as-cran.
          args: 'c("--no-manual", "--timings")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  BiocCheck:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          http-user-agent: ${{ env.R_VERSION == 'devel' && 'release' || '' }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::BiocCheck
          needs: check

      - name: BiocCheckGitClone
        run: |
          res <- BiocCheck::BiocCheckGitClone()
          if (res$getNum("error") > 0) quit(status = 1)
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(
            "new-package" = FALSE,
            "no-check-bioc-help" = TRUE,
            "quit-with-status" = TRUE
          )
        shell: Rscript {0}
